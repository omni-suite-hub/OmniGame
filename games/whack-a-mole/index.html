<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>疯狂打地鼠 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #064e3b;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: #022c22;
      border-bottom: 2px solid #047857;
      font-size: 14px;
      z-index: 10;
    }
    .hud-val {
      font-weight: bold;
      color: #facc15;
    }
    .arena-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #047857;
      overflow: hidden;
    }
    canvas {
      background: #065f46;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      border-radius: 12px;
      cursor: crosshair;
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(2, 44, 34, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.hidden { display: none; }
    .modal h2 { font-size: 32px; margin: 0 0 10px 0; color: #facc15; }
    .btn-action {
      margin-top: 18px;
      padding: 12px 28px;
      background: #f59e0b;
      color: #022c22;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>⏱️ 倒计时: <span id="time-el" class="hud-val">60s</span></div>
    <div>🔥 连击: <span id="combo-el" class="hud-val">0x</span></div>
    <div>🎯 命中率: <span id="acc-el" class="hud-val">100%</span></div>
    <div>🪙 得分: <span id="score-el" class="hud-val">0</span></div>
  </div>

  <div class="arena-container" id="container">
    <canvas id="game-canvas"></canvas>

    <div class="modal hidden" id="game-modal">
      <h2 id="modal-title">🔨 狂欢结束！</h2>
      <p id="modal-desc" style="font-size:16px;">最终得分: <span id="final-score" style="color:#facc15;font-weight:bold;">0</span></p>
      <button class="btn-action" id="btn-restart">再来一锤</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
