<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>断章战刃 - OmniGame</title>
<link rel="stylesheet" href="../_shared/game-layout.css">
<style>
  :root {
    --bg: #07090e;
    --card: #111520;
    --accent: #ff4757;
    --accent-glow: rgba(255, 71, 87, 0.4);
    --gold: #ffa502;
    --cyan: #00d2d3;
    --purple: #9b59b6;
    --text: #f1f2f6;
    --text-dim: #747d8c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #151928 0%, #07090e 80%);
  }
  /* Top HUD */
  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(7, 9, 14, 0.9) 0%, transparent 100%);
    pointer-events: none;
  }
  .hud-stat {
    display: flex;
    flex-direction: column;
  }
  .hud-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .hud-val {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
  }
  /* HP and Weapon Status */
  .weapon-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .weapon-name {
    font-size: 13px;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 8px rgba(255, 165, 2, 0.4);
  }
  .durability-bar {
    width: 110px;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .durability-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff4757, #ffa502);
    border-radius: 999px;
    transition: width 0.1s linear;
  }
  /* HP Bar */
  .hp-bar {
    width: 80px;
    height: 8px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 4px;
    border: 1px solid rgba(255, 71, 87, 0.3);
  }
  .hp-fill {
    height: 100%;
    width: 100%;
    background: var(--accent);
    transition: width 0.15s ease;
  }
  /* Canvas */
  #gameCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }
  /* On-Screen Touch Controls */
  .touch-ui {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 160px;
    z-index: 15;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    padding: 0 20px 20px;
    align-items: flex-end;
  }
  .joy-zone {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px dashed rgba(255, 255, 255, 0.18);
    position: relative;
    pointer-events: auto;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .joy-knob {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    pointer-events: none;
    transition: transform 0.05s ease-out;
  }
  .action-buttons {
    display: flex;
    gap: 14px;
    align-items: center;
    pointer-events: auto;
  }
  .touch-action-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 0;
    cursor: pointer;
    font-weight: 800;
    color: #fff;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    touch-action: manipulation;
    transition: transform 0.08s ease;
  }
  .touch-action-btn:active {
    transform: scale(0.92);
  }
  .btn-attack {
    background: linear-gradient(135deg, #ff4757, #ff6b81);
    box-shadow: 0 0 16px var(--accent-glow);
  }
  .btn-dash {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #2ed573, #1e90ff);
    font-size: 13px;
  }
  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(7, 9, 14, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .modal-title {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 0 20px var(--accent-glow);
  }
  .modal-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
    line-height: 1.6;
    max-width: 320px;
  }
  .btn-start {
    padding: 12px 36px;
    border-radius: 999px;
    border: 0;
    background: linear-gradient(135deg, #ff4757, #ffa502);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255, 71, 87, 0.4);
    transition: all 0.15s ease;
  }
  .btn-start:hover { transform: translateY(-2px); }
  .btn-start:active { transform: scale(0.97); }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 280px;
    margin-bottom: 24px;
  }
  .score-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px;
  }
  .score-card-num {
    font-size: 20px;
    font-weight: 800;
    color: var(--gold);
  }
  .score-card-lbl {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div class="top-hud">
    <div class="hud-stat">
      <span class="hud-label">生命值</span>
      <div class="hp-bar"><div id="hpFill" class="hp-fill"></div></div>
    </div>
    <div class="weapon-status">
      <span id="weaponName" class="weapon-name">🗡️ 断月双刃</span>
      <div class="durability-bar">
        <div id="durabilityFill" class="durability-fill"></div>
      </div>
    </div>
    <div class="hud-stat" style="text-align: right;">
      <span class="hud-label">波次 / 积分</span>
      <span id="scoreVal" class="hud-val">1波 · 0分</span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="touch-ui">
    <div id="joyZone" class="joy-zone">
      <div id="joyKnob" class="joy-knob"></div>
    </div>
    <div class="action-buttons">
      <button id="btnDash" class="touch-action-btn btn-dash">闪避</button>
      <button id="btnAttack" class="touch-action-btn btn-attack">
        <span>斩击</span>
        <span style="font-size:9px; opacity:0.8;">J / 空格</span>
      </button>
    </div>
  </div>

  <!-- Start Overlay -->
  <div id="startOverlay" class="overlay">
    <h1 class="modal-title">🗡️ 断章战刃</h1>
    <p class="modal-sub">
      动作肉鸽割草 · 战刃易折，断章重生！<br>
      每斩击数次，武器便会<b>【断裂爆破】</b>扫清周围敌人，并立刻重铸为全新神兵！<br>
      方向键/WASD移动 · 空格/J斩击 · K/Shift闪避
    </p>
    <button id="startBtn" class="btn-start">开始突围</button>
  </div>

  <!-- Over Overlay -->
  <div id="overOverlay" class="overlay hidden">
    <h2 class="modal-title" id="overTitle">战刃碎裂</h2>
    <p class="modal-sub" id="overSub">在潮水般的阴影敌人中力战而竭</p>
    <div class="score-grid">
      <div class="score-card">
        <div id="finalScore" class="score-card-num">0</div>
        <div class="score-card-lbl">最终得分</div>
      </div>
      <div class="score-card">
        <div id="finalWaves" class="score-card-num">0</div>
        <div class="score-card-lbl">通关波次</div>
      </div>
      <div class="score-card">
        <div id="finalKills" class="score-card-num">0</div>
        <div class="score-card-lbl">斩杀敌影</div>
      </div>
      <div class="score-card">
        <div id="finalBreaks" class="score-card-num">0</div>
        <div class="score-card-lbl">断章爆破</div>
      </div>
    </div>
    <button id="retryBtn" class="btn-start">再入战局</button>
  </div>
</div>

<script src="../_shared/storage.js"></script>
<script src="game.js"></script>
</body>
</html>
