<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>密室逃脱 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .scene-wrap {
      flex: 1;
      position: relative;
      background: #1e1b4b;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .scene-canvas {
      width: 100%;
      height: 100%;
      max-width: 800px;
      max-height: 500px;
      position: relative;
      background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
      border: 1px solid #334155;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .hotspot {
      position: absolute;
      border: 2px dashed rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .hotspot:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      transform: scale(1.02);
    }
    .hotspot-label {
      font-size: 13px;
      background: rgba(15, 23, 42, 0.8);
      padding: 2px 8px;
      border-radius: 4px;
      color: #f8fafc;
      pointer-events: none;
    }
    .inventory-bar {
      height: 70px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    .inv-title {
      font-size: 13px;
      color: #94a3b8;
      font-weight: bold;
    }
    .inv-slots {
      display: flex;
      gap: 8px;
    }
    .inv-slot {
      width: 50px;
      height: 50px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      position: relative;
    }
    .inv-slot.selected {
      border-color: #facc15;
      box-shadow: 0 0 8px #facc15;
    }
    .dialog-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .dialog-overlay.hidden { display: none; }
    .dialog-box {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 20px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .dialog-title { font-size: 18px; font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
    .dialog-text { font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-bottom: 16px; }
    .btn-close {
      padding: 8px 18px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .code-input-group {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .code-digit {
      width: 40px;
      height: 48px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #facc15;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>🚪 密室逃脱 (Room Escape)</div>
    <div>状态: <span id="status-el" style="color:#facc15;">密室受困中</span></div>
    <div>时间: <span id="timer-el" style="color:#38bdf8;">00:00</span></div>
  </div>

  <div class="scene-wrap">
    <div class="scene-canvas" id="scene">
      <!-- Interactive objects -->
      <div class="hotspot" id="obj-door" style="left: 42%; top: 20%; width: 16%; height: 60%;">
        <span class="hotspot-label">🚪 逃生厚铁门</span>
      </div>
      <div class="hotspot" id="obj-safe" style="left: 12%; top: 25%; width: 18%; height: 25%;">
        <span class="hotspot-label">🗄️ 密码暗柜</span>
      </div>
      <div class="hotspot" id="obj-desk" style="left: 8%; top: 62%; width: 28%; height: 30%;">
        <span class="hotspot-label">🪑 书桌与抽屉</span>
      </div>
      <div class="hotspot" id="obj-painting" style="left: 70%; top: 22%; width: 20%; height: 28%;">
        <span class="hotspot-label">🖼️ 神秘油画</span>
      </div>
      <div class="hotspot" id="obj-clock" style="left: 72%; top: 60%; width: 16%; height: 32%;">
        <span class="hotspot-label">🕰️ 复古落地钟</span>
      </div>
    </div>

    <!-- Dialog / Inspect Modal -->
    <div class="dialog-overlay hidden" id="dialog">
      <div class="dialog-box">
        <div class="dialog-title" id="d-title">调查物品</div>
        <div class="dialog-text" id="d-text">这是一把坚固的防盗门。</div>
        <div id="d-interactive"></div>
        <button class="btn-close" id="d-close">关闭</button>
      </div>
    </div>
  </div>

  <div class="inventory-bar">
    <div class="inv-title">🎒 物品栏:</div>
    <div class="inv-slots" id="inv-slots"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
