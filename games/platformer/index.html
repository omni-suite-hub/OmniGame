<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>平台跳跃 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 14px;
      z-index: 10;
    }
    .stat-badge {
      font-weight: bold;
      color: #facc15;
    }
    .canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      overflow: hidden;
    }
    canvas {
      background: #1e1b4b;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      touch-action: none;
    }
    .touch-controls {
      display: none;
      position: absolute;
      bottom: 16px;
      left: 0;
      right: 0;
      padding: 0 20px;
      justify-content: space-between;
      pointer-events: none;
      z-index: 20;
    }
    .touch-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid #38bdf8;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .touch-btn:active, .touch-btn.active {
      background: #38bdf8;
      color: #0f172a;
      transform: scale(0.92);
    }
    @media (hover: none), (pointer: coarse) {
      .touch-controls { display: flex; }
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.hidden { display: none; }
    .modal h2 { font-size: 28px; margin: 0 0 10px 0; color: #facc15; }
    .btn-action {
      margin-top: 16px;
      padding: 10px 24px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>🏃 平台跳跃 (Platformer)</div>
    <div>💎 宝石: <span id="gems-el" class="stat-badge">0 / 5</span></div>
    <div>关卡: <span id="level-el" class="stat-badge">1</span></div>
  </div>

  <div class="canvas-container" id="container">
    <canvas id="game-canvas"></canvas>

    <div class="touch-controls">
      <div class="touch-group">
        <button class="touch-btn" id="btn-left">◀</button>
        <button class="touch-btn" id="btn-right">▶</button>
      </div>
      <div class="touch-group">
        <button class="touch-btn" id="btn-jump" style="border-color:#facc15;">⏫</button>
      </div>
    </div>

    <div class="modal hidden" id="modal">
      <h2 id="modal-title">🎉 通关凯旋！</h2>
      <p id="modal-desc">完美避开所有尖刺险阻，顺利触达终点红旗！</p>
      <button class="btn-action" id="btn-next">下一关</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
