<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>造桥大师 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: #1e293b;
      border-bottom: 2px solid #334155;
      font-size: 13px;
      z-index: 10;
    }
    .hud-val {
      font-weight: bold;
      color: #facc15;
    }
    .toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 6px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }
    .tool-btn {
      padding: 6px 14px;
      background: #334155;
      border: 1px solid #64748b;
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .tool-btn.active {
      background: #2563eb;
      border-color: #60a5fa;
    }
    .tool-btn.btn-test {
      background: #16a34a;
      border-color: #4ade80;
    }
    .tool-btn.btn-edit {
      background: #d97706;
      border-color: #fbbf24;
    }
    .arena-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0284c7;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 4px 25px rgba(0,0,0,0.6);
      border-radius: 8px;
      touch-action: none;
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.hidden { display: none; }
    .modal h2 { font-size: 28px; margin: 0 0 10px 0; color: #facc15; }
    .btn-action {
      margin-top: 16px;
      padding: 10px 24px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>💰 剩余预算: <span id="budget-el" class="hud-val">$1200</span></div>
    <div>关卡: <span id="level-el" class="hud-val">1 / 3</span></div>
    <div>状态: <span id="status-el" class="hud-val" style="color:#38bdf8;">设计中</span></div>
  </div>

  <div class="toolbar">
    <button class="tool-btn active" id="btn-road">🛣️ 桥面路段 ($100)</button>
    <button class="tool-btn" id="btn-wood">🪵 承重桁架 ($50)</button>
    <button class="tool-btn" id="btn-clear">🗑️ 清空</button>
    <button class="tool-btn btn-test" id="btn-simulate">🚗 开始测试</button>
  </div>

  <div class="arena-container" id="container">
    <canvas id="game-canvas"></canvas>

    <div class="modal hidden" id="game-modal">
      <h2 id="modal-title">🏆 顺利通车！</h2>
      <p id="modal-desc" style="font-size:16px;">大桥坚如磐石，车辆安全抵达对岸！</p>
      <button class="btn-action" id="btn-next">进入下一关</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
