<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>键位防线 - OmniGame</title>
<link rel="stylesheet" href="../_shared/game-layout.css">
<style>
  :root {
    --bg: #070913;
    --card: #101528;
    --cyan: #00f2fe;
    --cyan-glow: rgba(0, 242, 254, 0.4);
    --neon-pink: #ff007f;
    --gold: #fbc531;
    --text: #f5f6fa;
    --text-dim: #7f8fa6;
    --key-bg: rgba(255, 255, 255, 0.08);
    --key-border: rgba(255, 255, 255, 0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, #151c38 0%, #070913 80%);
  }
  /* Top HUD */
  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(7, 9, 19, 0.95) 0%, transparent 100%);
    pointer-events: none;
  }
  .hud-stat {
    display: flex;
    flex-direction: column;
  }
  .hud-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .hud-val {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 10px var(--cyan-glow);
  }
  .defense-hp {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .defense-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--cyan);
  }
  .defense-bar {
    width: 90px;
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(0, 242, 254, 0.3);
  }
  .defense-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #00f2fe, #4facfe);
    border-radius: 999px;
    transition: width 0.15s ease;
  }
  /* Canvas */
  #gameCanvas {
    width: 100%;
    flex: 1;
    min-height: 0;
    display: block;
  }
  /* Virtual Cyber Keyboard at bottom */
  .keyboard-deck {
    flex-shrink: 0;
    z-index: 15;
    padding: 6px 6px 14px;
    background: rgba(16, 21, 40, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .kb-row {
    display: flex;
    justify-content: center;
    gap: 3.5px;
  }
  .kb-key {
    flex: 1;
    max-width: 44px;
    height: 38px;
    background: var(--key-bg);
    border: 1px solid var(--key-border);
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.08s ease;
  }
  .kb-key:active, .kb-key.active {
    background: var(--cyan);
    color: #070913;
    transform: scale(0.92);
    box-shadow: 0 0 12px var(--cyan);
  }
  .kb-key.emp-btn {
    flex: 2.2;
    max-width: 110px;
    background: rgba(255, 0, 127, 0.18);
    border-color: rgba(255, 0, 127, 0.4);
    color: #ff007f;
    font-size: 12px;
  }
  .kb-key.emp-btn:active, .kb-key.emp-btn.active {
    background: #ff007f;
    color: #fff;
    box-shadow: 0 0 16px rgba(255, 0, 127, 0.8);
  }
  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(7, 9, 19, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .modal-title {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 0 20px var(--cyan-glow);
  }
  .modal-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
    line-height: 1.6;
    max-width: 320px;
  }
  .btn-start {
    padding: 12px 36px;
    border-radius: 999px;
    border: 0;
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    color: #070913;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
    transition: all 0.15s ease;
  }
  .btn-start:hover { transform: translateY(-2px); }
  .btn-start:active { transform: scale(0.97); }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 280px;
    margin-bottom: 24px;
  }
  .score-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px;
  }
  .score-card-num {
    font-size: 20px;
    font-weight: 800;
    color: var(--cyan);
  }
  .score-card-lbl {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div class="top-hud">
    <div class="hud-stat">
      <span class="hud-label">得分</span>
      <span id="scoreVal" class="hud-val">0</span>
    </div>
    <div class="defense-hp">
      <span class="defense-title">🛡️ 防线核心</span>
      <div class="defense-bar"><div id="hpFill" class="defense-fill"></div></div>
    </div>
    <div class="hud-stat" style="text-align: right;">
      <span class="hud-label">连击 / 狂热</span>
      <span id="comboVal" class="hud-val" style="color: var(--gold);">0x</span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- Virtual Keyboard -->
  <div class="keyboard-deck">
    <div class="kb-row">
      <button class="kb-key" data-key="Q">Q</button>
      <button class="kb-key" data-key="W">W</button>
      <button class="kb-key" data-key="E">E</button>
      <button class="kb-key" data-key="R">R</button>
      <button class="kb-key" data-key="T">T</button>
      <button class="kb-key" data-key="Y">Y</button>
      <button class="kb-key" data-key="U">U</button>
      <button class="kb-key" data-key="I">I</button>
      <button class="kb-key" data-key="O">O</button>
      <button class="kb-key" data-key="P">P</button>
    </div>
    <div class="kb-row">
      <button class="kb-key" data-key="A">A</button>
      <button class="kb-key" data-key="S">S</button>
      <button class="kb-key" data-key="D">D</button>
      <button class="kb-key" data-key="F">F</button>
      <button class="kb-key" data-key="G">G</button>
      <button class="kb-key" data-key="H">H</button>
      <button class="kb-key" data-key="J">J</button>
      <button class="kb-key" data-key="K">K</button>
      <button class="kb-key" data-key="L">L</button>
    </div>
    <div class="kb-row">
      <button class="kb-key" data-key="Z">Z</button>
      <button class="kb-key" data-key="X">X</button>
      <button class="kb-key" data-key="C">C</button>
      <button class="kb-key" data-key="V">V</button>
      <button class="kb-key emp-btn" data-key="SPACE">⚡ EMP 脉冲</button>
      <button class="kb-key" data-key="B">B</button>
      <button class="kb-key" data-key="N">N</button>
      <button class="kb-key" data-key="M">M</button>
    </div>
  </div>

  <!-- Start Overlay -->
  <div id="startOverlay" class="overlay">
    <h1 class="modal-title">🛡️ 键位防线</h1>
    <p class="modal-sub">
      赛博打字塔防 · 键盘锁定下落恶意代码！<br>
      敲击键盘或触控键位发射高能激光炮击破病毒<br>
      积攒连击激活【超载狂热】全屏齐射 · 空格释放 EMP！
    </p>
    <button id="startBtn" class="btn-start">启动防线</button>
  </div>

  <!-- Over Overlay -->
  <div id="overOverlay" class="overlay hidden">
    <h2 class="modal-title" id="overTitle">防线沦陷</h2>
    <p class="modal-sub" id="overSub">恶意代码击穿了核心矩阵防火墙</p>
    <div class="score-grid">
      <div class="score-card">
        <div id="finalScore" class="score-card-num">0</div>
        <div class="score-card-lbl">最终得分</div>
      </div>
      <div class="score-card">
        <div id="finalKills" class="score-card-num">0</div>
        <div class="score-card-lbl">拦截病毒</div>
      </div>
      <div class="score-card">
        <div id="finalMaxCombo" class="score-card-num">0</div>
        <div class="score-card-lbl">最高连击</div>
      </div>
      <div class="score-card">
        <div id="finalWpm" class="score-card-num">0</div>
        <div class="score-card-lbl">拦截速度 WPM</div>
      </div>
    </div>
    <button id="retryBtn" class="btn-start">重新部署</button>
  </div>
</div>

<script src="../_shared/storage.js"></script>
<script src="game.js"></script>
</body>
</html>
