<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>雷霆战机 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: #0b0f19;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
      z-index: 10;
    }
    .hud-val {
      font-weight: bold;
      color: #38bdf8;
    }
    .arena-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #020617;
      overflow: hidden;
    }
    canvas {
      background: #000000;
      box-shadow: 0 4px 25px rgba(0,0,0,0.9);
      touch-action: none;
    }
    .bomb-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #ef4444;
      border: 3px solid #f87171;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      box-shadow: 0 4px 15px rgba(239,68,68,0.6);
      cursor: pointer;
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.hidden { display: none; }
    .modal h2 { font-size: 28px; margin: 0 0 10px 0; color: #38bdf8; }
    .btn-action {
      margin-top: 16px;
      padding: 10px 24px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>❤️ 战机: <span id="lives-el" class="hud-val" style="color:#ef4444;">3</span></div>
    <div>💣 核弹: <span id="bombs-el" class="hud-val" style="color:#f59e0b;">2</span></div>
    <div>⚡ 火力: <span id="power-el" class="hud-val">Lv.1</span></div>
    <div>🪙 得分: <span id="score-el" class="hud-val">0</span></div>
  </div>

  <div class="arena-container" id="container">
    <canvas id="game-canvas"></canvas>
    <button class="bomb-btn" id="btn-bomb">核弹</button>

    <div class="modal hidden" id="game-modal">
      <h2 id="modal-title">🏆 歼灭母舰！</h2>
      <p id="modal-desc">敌方星际旗舰已被彻底击沉，银河和平恢复！</p>
      <button class="btn-action" id="btn-restart">再次启航</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
