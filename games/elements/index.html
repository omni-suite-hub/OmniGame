<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>元素炼金塔 - OmniGame</title>
<link rel="stylesheet" href="../_shared/game-layout.css">
<style>
  :root {
    --bg: #090b16;
    --card: #12152b;
    --fire: #ef4444;
    --water: #06b6d4;
    --earth: #10b981;
    --wind: #a855f7;
    --gold: #fbbf24;
    --text: #f8fafc;
    --text-dim: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, #1a1e3d 0%, #090b16 85%);
  }
  /* Top HUD */
  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(9, 11, 22, 0.95) 0%, transparent 100%);
    pointer-events: none;
  }
  .hud-stat {
    display: flex;
    flex-direction: column;
  }
  .hud-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .hud-val {
    font-size: 17px;
    font-weight: 800;
    color: #fff;
  }
  .element-badge {
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    background: rgba(239, 68, 68, 0.25);
    border: 1px solid var(--fire);
    transition: all 0.15s ease;
  }
  /* Canvas */
  #gameCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Bottom Controls Deck */
  .control-deck {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 140px;
    z-index: 15;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    padding: 0 16px 14px;
  }
  /* Element Quick Switch Bar */
  .element-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    pointer-events: auto;
  }
  .elem-btn {
    flex: 1;
    max-width: 72px;
    height: 38px;
    border-radius: 12px;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.1s ease;
  }
  .elem-btn.active {
    transform: scale(1.06);
    box-shadow: 0 0 14px rgba(255, 255, 255, 0.3);
  }
  .elem-btn[data-elem="fire"].active { background: rgba(239, 68, 68, 0.35); border-color: var(--fire); color: var(--fire); }
  .elem-btn[data-elem="water"].active { background: rgba(6, 182, 212, 0.35); border-color: var(--water); color: var(--water); }
  .elem-btn[data-elem="earth"].active { background: rgba(16, 185, 129, 0.35); border-color: var(--earth); color: var(--earth); }
  .elem-btn[data-elem="wind"].active { background: rgba(168, 85, 247, 0.35); border-color: var(--wind); color: var(--wind); }

  .movement-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: auto;
  }
  .d-pad {
    display: flex;
    gap: 10px;
  }
  .ctrl-btn {
    width: 58px;
    height: 52px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #fff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s ease;
  }
  .ctrl-btn:active {
    transform: scale(0.92);
  }
  .btn-jump {
    width: 72px;
    height: 52px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    border: 0;
    font-size: 14px;
    font-weight: 800;
  }
  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(9, 11, 22, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .modal-title {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
  }
  .modal-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
    line-height: 1.6;
    max-width: 320px;
  }
  .btn-start {
    padding: 12px 36px;
    border-radius: 999px;
    border: 0;
    background: linear-gradient(135deg, #ef4444, #f59e0b);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
    transition: all 0.15s ease;
  }
  .btn-start:hover { transform: translateY(-2px); }
  .btn-start:active { transform: scale(0.97); }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 280px;
    margin-bottom: 24px;
  }
  .score-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px;
  }
  .score-card-num {
    font-size: 20px;
    font-weight: 800;
    color: var(--gold);
  }
  .score-card-lbl {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div class="top-hud">
    <div class="hud-stat">
      <span class="hud-label">炼金塔层</span>
      <span id="floorVal" class="hud-val">第 1 层</span>
    </div>
    <div id="elemBadge" class="element-badge">🔥 火之灵</div>
    <div class="hud-stat" style="text-align: right;">
      <span class="hud-label">元素晶石</span>
      <span id="scoreVal" class="hud-val" style="color: var(--gold);">0 💎</span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="control-deck">
    <div class="element-bar">
      <button class="elem-btn active" data-elem="fire">🔥 火 (1)</button>
      <button class="elem-btn" data-elem="water">💧 水 (2)</button>
      <button class="elem-btn" data-elem="earth">🌿 土 (3)</button>
      <button class="elem-btn" data-elem="wind">🌪️ 风 (4)</button>
    </div>
    <div class="movement-bar">
      <div class="d-pad">
        <button id="btnLeft" class="ctrl-btn">◀</button>
        <button id="btnRight" class="ctrl-btn">▶</button>
      </div>
      <button id="btnJump" class="ctrl-btn btn-jump">跳跃</button>
    </div>
  </div>

  <!-- Start Overlay -->
  <div id="startOverlay" class="overlay">
    <h1 class="modal-title">🔮 元素炼金塔</h1>
    <p class="modal-sub">
      四象转灵 · 攀登古老炼金法塔！<br>
      按 1/2/3/4 或点击切换四象元素：<br>
      <b>【🔥火】</b>焚烧荆棘藤蔓 · <b>【💧水】</b>潜渡水幕寒潭<br>
      <b>【🌿土】</b>坠碎石板岩层 · <b>【🌪️风】</b>御风双跳滑翔<br>
      方向键移动 · 空格跳跃 · 1/2/3/4切换元素
    </p>
    <button id="startBtn" class="btn-start">登塔启程</button>
  </div>

  <!-- Clear Overlay -->
  <div id="clearOverlay" class="overlay hidden">
    <h2 class="modal-title" id="clearTitle">塔层突破！</h2>
    <p class="modal-sub" id="clearSub">四象融通，通往法塔更高层</p>
    <div class="score-grid">
      <div class="score-card">
        <div id="finalFloor" class="score-card-num">1</div>
        <div class="score-card-lbl">通关层数</div>
      </div>
      <div class="score-card">
        <div id="finalScore" class="score-card-num">0 💎</div>
        <div class="score-card-lbl">炼金晶石</div>
      </div>
    </div>
    <button id="nextBtn" class="btn-start">登上一层</button>
  </div>
</div>

<script src="../_shared/storage.js"></script>
<script src="game.js"></script>
</body>
</html>
