<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>开心连连看 · OmniGame</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-wrap">
      <header class="game-header">
        <div class="score-card">
          <span class="label">得分</span>
          <span class="val" id="scoreVal">0</span>
        </div>
        <div class="timer-card" title="剩余时间">
          <span class="timer-label">倒计时</span>
          <span class="timer-val" id="timerVal">02:30</span>
        </div>
        <div class="score-card best">
          <span class="label">最高</span>
          <span class="val" id="bestVal">0</span>
        </div>
        <div class="header-tools">
          <button id="hintBtn" class="tool-btn item" title="提示 (剩余 3 次)">💡 3</button>
          <button id="shuffleBtn" class="tool-btn item" title="洗牌 (剩余 3 次)">🔀 3</button>
          <button id="soundBtn" class="tool-btn" title="开关音效">🔊</button>
          <button id="restartBtn" class="tool-btn" title="重开">🔄</button>
        </div>
      </header>

      <main class="board-container" id="boardContainer">
        <canvas id="gameCanvas" width="380" height="460"></canvas>
      </main>

      <footer class="game-footer">
        <p class="tip-text">点击两个相同图案，折线转角不超过两次即可消除！</p>
      </footer>

      <!-- Game Over / Victory Modal -->
      <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-card">
          <div class="modal-emoji" id="modalEmoji">🎉</div>
          <h2 class="modal-title" id="modalTitle">全清胜利！</h2>
          <div class="modal-stats">
            <div class="stat-item">
              <span class="stat-label">最终得分</span>
              <span class="stat-num" id="finalScore">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">最高纪录</span>
              <span class="stat-num" id="finalBest">0</span>
            </div>
          </div>
          <button id="playAgainBtn" class="modal-btn">🔄 再来一局</button>
        </div>
      </div>
    </div>

    <script src="../_shared/storage.js"></script>
    <script src="game.js"></script>
  </body>
</html>
