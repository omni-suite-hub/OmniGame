<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>模拟城市轻量版 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 13px;
    }
    .hud-val {
      font-weight: bold;
      color: #38bdf8;
    }
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      gap: 8px;
      overflow-y: auto;
    }
    .city-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      background: #1e293b;
      padding: 6px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .zone-cell {
      background: #334155;
      border: 1px solid #475569;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      font-size: 20px;
      transition: all 0.1s;
    }
    .zone-cell:hover {
      border-color: #38bdf8;
    }
    .build-palette {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      max-width: 500px;
      width: 100%;
      padding-bottom: 4px;
    }
    .palette-btn {
      flex: 1;
      min-width: 60px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      color: #f8fafc;
    }
    .palette-btn.active {
      border-color: #38bdf8;
      background: #0284c7;
    }
    .palette-cost {
      font-size: 11px;
      color: #facc15;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>👥 人口: <span id="pop-el" class="hud-val">0</span></div>
    <div>🪙 资金: <span id="money-el" class="hud-val" style="color:#facc15;">$300</span></div>
    <div>😊 满意度: <span id="happy-el" class="hud-val" style="color:#22c55e;">100%</span></div>
  </div>

  <div class="main-view">
    <div class="city-grid" id="city-grid"></div>

    <div>
      <div style="font-size:12px; color:#94a3b8; margin-bottom:4px; text-align:center;">选择规划建筑（点击地块进行建造或升级）</div>
      <div class="build-palette" id="palette"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
