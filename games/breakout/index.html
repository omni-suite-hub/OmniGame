<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>经典打砖块 · OmniGame</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-wrap">
      <header class="game-header">
        <div class="score-card">
          <span class="label">得分</span>
          <span class="val" id="scoreVal">0</span>
        </div>
        <div class="lives-card" title="剩余生命">
          <span class="lives-label">生命</span>
          <div class="lives-icons" id="livesIcons">❤️❤️❤️</div>
        </div>
        <div class="level-card" title="当前关卡">
          <span class="level-label">关卡</span>
          <span class="level-val" id="levelVal">1</span>
        </div>
        <div class="score-card best">
          <span class="label">最高</span>
          <span class="val" id="bestVal">0</span>
        </div>
        <div class="header-tools">
          <button id="soundBtn" class="tool-btn" title="开关音效">🔊</button>
          <button id="restartBtn" class="tool-btn" title="重新开始">🔄</button>
        </div>
      </header>

      <main class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas" width="380" height="560"></canvas>
        <div id="startOverlay" class="start-hint">按 空格 或 点击屏幕 发射弹球 🧱</div>
      </main>

      <footer class="game-footer">
        <span class="tip-text">移动鼠标/手指或方向键 <code>← →</code> 控制挡板；吃道具击碎全部砖块！</span>
      </footer>

      <!-- Game Over Modal -->
      <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-card">
          <div class="modal-emoji" id="modalEmoji">🧱</div>
          <h2 class="modal-title" id="modalTitle">GAME OVER</h2>
          <div class="modal-stats">
            <div class="stat-item">
              <span class="stat-label">本次得分</span>
              <span class="stat-num" id="finalScore">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">最高记录</span>
              <span class="stat-num" id="finalBest">0</span>
            </div>
          </div>
          <button id="playAgainBtn" class="modal-btn">🔄 再来一局 (按空格重开)</button>
        </div>
      </div>
    </div>

    <script src="../_shared/storage.js"></script>
    <script src="game.js"></script>
  </body>
</html>
