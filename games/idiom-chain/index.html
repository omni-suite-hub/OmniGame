<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>成语接龙 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .score-badge {
      font-weight: bold;
      color: #facc15;
    }
    .main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      overflow-y: auto;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    .chat-history {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding: 8px;
      background: #1e293b;
      border-radius: 12px;
      min-height: 200px;
    }
    .idiom-bubble {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 80%;
      font-size: 16px;
      line-height: 1.4;
      animation: pop 0.2s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .bubble-bot {
      background: #334155;
      color: #f1f5f9;
      align-self: flex-start;
      border-left: 4px solid #38bdf8;
    }
    .bubble-user {
      background: #0284c7;
      color: #ffffff;
      align-self: flex-end;
      border-right: 4px solid #facc15;
    }
    .bubble-meaning {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 4px;
    }
    .target-box {
      background: #1e293b;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      border: 1px dashed #38bdf8;
    }
    .target-char {
      font-size: 24px;
      font-weight: bold;
      color: #38bdf8;
    }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .option-btn {
      padding: 12px 8px;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .option-btn:hover {
      background: #475569;
      border-color: #38bdf8;
    }
    .option-btn:active {
      transform: scale(0.96);
    }
    .timer-bar {
      height: 4px;
      background: #334155;
      border-radius: 2px;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%;
      background: #22c55e;
      width: 100%;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>📜 成语接龙</div>
    <div>连击: <span id="streak-el" class="score-badge">0</span> 连</div>
    <div>最高: <span id="best-el" class="score-badge">0</span> 连</div>
  </div>

  <div class="main-body">
    <div class="timer-bar">
      <div class="timer-fill" id="timer-fill"></div>
    </div>

    <div class="chat-history" id="chat-history"></div>

    <div class="target-box">
      请接以「<span id="target-char" class="target-char">意</span>」字开头的成语：
    </div>

    <div class="options-grid" id="options-grid"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
