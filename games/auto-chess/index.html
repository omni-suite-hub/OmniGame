<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>极简自走棋 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: #1e293b;
      border-bottom: 2px solid #334155;
      font-size: 13px;
      z-index: 10;
    }
    .hud-val {
      font-weight: bold;
      color: #facc15;
    }
    .shop-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 6px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      overflow-x: auto;
    }
    .hero-card {
      width: 76px;
      height: 74px;
      background: #1e293b;
      border: 2px solid #475569;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .hero-card:active { transform: scale(0.96); }
    .hero-card .icon { font-size: 22px; }
    .hero-card .cost { color: #facc15; font-weight: bold; }
    .btn-reroll {
      padding: 8px 12px;
      background: #475569;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-fight {
      padding: 8px 16px;
      background: #ea580c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    .arena-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090d16;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
      border-radius: 10px;
      touch-action: none;
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.hidden { display: none; }
    .modal h2 { font-size: 28px; margin: 0 0 10px 0; color: #facc15; }
    .btn-action {
      margin-top: 16px;
      padding: 10px 24px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>❤️ 生命: <span id="hp-el" class="hud-val" style="color:#ef4444;">100</span></div>
    <div>🪙 金币: <span id="gold-el" class="hud-val">10</span></div>
    <div>回合: <span id="round-el" class="hud-val">1 / 5</span></div>
    <div>状态: <span id="phase-el" class="hud-val" style="color:#38bdf8;">备战阶段</span></div>
  </div>

  <div class="shop-bar">
    <button class="btn-reroll" id="btn-reroll">🔄 刷新 ($2)</button>
    <div id="shop-cards" style="display:flex; gap:8px;"></div>
    <button class="btn-fight" id="btn-fight">⚔️ 开始战斗</button>
  </div>

  <div class="arena-container" id="container">
    <canvas id="game-canvas"></canvas>

    <div class="modal hidden" id="game-modal">
      <h2 id="modal-title">🏆 登顶棋王！</h2>
      <p id="modal-desc" style="font-size:16px;">历经 5 轮激战，最终夺取棋盘巅峰王座！</p>
      <button class="btn-action" id="btn-restart">重战江湖</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
