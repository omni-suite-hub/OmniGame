<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>数独 - OmniGame</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sdk-container">
    <header class="sdk-header">
      <div class="sdk-title-row">
        <h1 class="sdk-title">数独 <span>Sudoku</span></h1>
        <div class="sdk-tools">
          <button id="soundBtn" class="sdk-icon-btn" title="声音开关">🔊</button>
          <button id="pauseBtn" class="sdk-icon-btn" title="暂停计时">⏸️</button>
          <button id="newGameBtn" class="sdk-btn sdk-btn-accent" title="新谜题">新题</button>
        </div>
      </div>

      <div class="sdk-status-row">
        <div class="sdk-diff-wrap">
          <select id="diffSelect" class="sdk-select">
            <option value="easy">简单</option>
            <option value="medium" selected>中等</option>
            <option value="hard">困难</option>
            <option value="expert">大师</option>
          </select>
        </div>
        <div class="sdk-mistakes" id="mistakesWrap">
          错误: <span id="mistakeCount">0</span>/3
        </div>
        <div class="sdk-timer" id="timerText">00:00</div>
      </div>
    </header>

    <div class="sdk-board-wrap">
      <div class="sdk-board" id="board">
        <!-- 81 cells generated by JS -->
      </div>
      <div class="sdk-pause-overlay" id="pauseOverlay">
        <div class="pause-msg">已暂停</div>
        <button id="resumeBtn" class="sdk-btn sdk-btn-primary">继续游戏</button>
      </div>
    </div>

    <div class="sdk-action-bar">
      <button class="action-btn" id="undoBtn" title="撤销">
        <span class="action-icon">↩️</span>
        <span class="action-label">撤销</span>
      </button>
      <button class="action-btn" id="eraseBtn" title="擦除">
        <span class="action-icon">🧹</span>
        <span class="action-label">擦除</span>
      </button>
      <button class="action-btn" id="noteBtn" title="笔记模式">
        <span class="action-icon">✏️</span>
        <span class="action-label">笔记 <b id="noteState">关</b></span>
      </button>
      <button class="action-btn" id="hintBtn" title="提示一个格子">
        <span class="action-icon">💡</span>
        <span class="action-label">提示</span>
      </button>
    </div>

    <div class="sdk-numpad" id="numpad">
      <button class="num-btn" data-val="1">1</button>
      <button class="num-btn" data-val="2">2</button>
      <button class="num-btn" data-val="3">3</button>
      <button class="num-btn" data-val="4">4</button>
      <button class="num-btn" data-val="5">5</button>
      <button class="num-btn" data-val="6">6</button>
      <button class="num-btn" data-val="7">7</button>
      <button class="num-btn" data-val="8">8</button>
      <button class="num-btn" data-val="9">9</button>
    </div>
  </div>

  <div class="modal-overlay" id="sdkModal">
    <div class="modal-card">
      <div class="modal-emoji" id="modalEmoji">🎉</div>
      <h2 class="modal-title" id="modalTitle">恭喜通关！</h2>
      <p class="modal-desc" id="modalDesc">用时 04:28 · 零失误解题</p>
      <div class="modal-actions">
        <button id="modalNewGameBtn" class="modal-btn modal-btn-primary">开启新局</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
