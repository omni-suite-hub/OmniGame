<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>植物防线 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 13px;
      z-index: 10;
    }
    .sun-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ca8a04;
      padding: 4px 10px;
      border-radius: 16px;
      font-weight: bold;
      color: #fff;
    }
    .cards-bar {
      display: flex;
      gap: 6px;
      padding: 6px 12px;
      background: #0f172a;
      overflow-x: auto;
      border-bottom: 1px solid #334155;
    }
    .plant-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      border: 2px solid #475569;
      border-radius: 8px;
      width: 58px;
      height: 64px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: all 0.1s;
    }
    .plant-card.selected {
      border-color: #facc15;
      background: #334155;
      transform: translateY(-2px);
    }
    .plant-card.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .card-icon { font-size: 24px; }
    .card-cost {
      font-size: 11px;
      font-weight: bold;
      color: #facc15;
    }
    .card-shovel {
      border-color: #ef4444;
    }
    .arena-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #14532d;
      overflow: hidden;
    }
    canvas {
      background: #15803d;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      touch-action: none;
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.hidden { display: none; }
    .modal h2 { font-size: 28px; margin: 0 0 10px 0; color: #facc15; }
    .btn-action {
      margin-top: 16px;
      padding: 10px 24px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="sun-badge">☀️ <span id="sun-el">150</span></div>
    <div>🌊 波次: <span id="wave-el" style="color:#facc15; font-weight:bold;">1 / 3</span></div>
    <div>🧟 剩余僵尸: <span id="zombie-left-el" style="color:#f87171; font-weight:bold;">15</span></div>
  </div>

  <div class="cards-bar" id="cards-bar">
    <div class="plant-card" data-type="sunflower">
      <span class="card-icon">🌻</span>
      <span class="card-cost">50</span>
    </div>
    <div class="plant-card" data-type="peashooter">
      <span class="card-icon">🌱</span>
      <span class="card-cost">100</span>
    </div>
    <div class="plant-card" data-type="wallnut">
      <span class="card-icon">🌰</span>
      <span class="card-cost">50</span>
    </div>
    <div class="plant-card" data-type="cherrybomb">
      <span class="card-icon">🍒</span>
      <span class="card-cost">150</span>
    </div>
    <div class="plant-card card-shovel" data-type="shovel">
      <span class="card-icon">⛏️</span>
      <span class="card-cost">铲除</span>
    </div>
  </div>

  <div class="arena-container" id="container">
    <canvas id="game-canvas"></canvas>

    <div class="modal hidden" id="game-modal">
      <h2 id="modal-title">🌻 防守大捷！</h2>
      <p id="modal-desc">僵尸大军已被彻底击溃，花园完好无损！</p>
      <button class="btn-action" id="btn-restart">保卫下一轮</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
