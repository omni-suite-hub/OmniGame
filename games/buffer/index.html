<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>子弹缓冲 - OmniGame</title>
<link rel="stylesheet" href="../_shared/game-layout.css">
<style>
  :root {
    --bg: #070811;
    --card: #121424;
    --acid: #d8ff3e;
    --acid-glow: rgba(216, 255, 62, 0.4);
    --pink: #ff007f;
    --cyan: #00f2fe;
    --text: #f5f6fa;
    --text-dim: #7f8fa6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, #161833 0%, #070811 80%);
  }
  /* Top HUD */
  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(7, 8, 17, 0.95) 0%, transparent 100%);
    pointer-events: none;
  }
  .hud-stat {
    display: flex;
    flex-direction: column;
  }
  .hud-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .hud-val {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 10px var(--acid-glow);
  }
  /* Buffer Bar */
  .buffer-meter {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .buffer-title {
    font-size: 11px;
    font-weight: 800;
    color: var(--acid);
    letter-spacing: 0.5px;
  }
  .buffer-bar {
    width: 96px;
    height: 7px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(216, 255, 62, 0.35);
  }
  .buffer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #d8ff3e, #00f2fe);
    border-radius: 999px;
    transition: width 0.08s linear;
  }
  /* Canvas */
  #gameCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }
  /* Touch Controls Deck */
  .touch-deck {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 130px;
    z-index: 15;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px 16px;
  }
  .joy-zone {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px dashed rgba(255, 255, 255, 0.15);
    position: relative;
    pointer-events: auto;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .joy-knob {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.4);
    pointer-events: none;
  }
  .btn-buffer {
    width: 80px;
    height: 70px;
    border-radius: 20px;
    background: linear-gradient(135deg, #d8ff3e, #00f2fe);
    border: 0;
    color: #070811;
    font-weight: 900;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(216, 255, 62, 0.5);
    pointer-events: auto;
    touch-action: manipulation;
    transition: transform 0.08s ease;
  }
  .btn-buffer:active, .btn-buffer.active {
    transform: scale(0.92);
    box-shadow: 0 0 24px rgba(216, 255, 62, 0.8);
  }
  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(7, 8, 17, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .modal-title {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 0 20px var(--acid-glow);
  }
  .modal-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
    line-height: 1.6;
    max-width: 320px;
  }
  .btn-start {
    padding: 12px 36px;
    border-radius: 999px;
    border: 0;
    background: linear-gradient(135deg, #d8ff3e, #00f2fe);
    color: #070811;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(216, 255, 62, 0.4);
    transition: all 0.15s ease;
  }
  .btn-start:hover { transform: translateY(-2px); }
  .btn-start:active { transform: scale(0.97); }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 280px;
    margin-bottom: 24px;
  }
  .score-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px;
  }
  .score-card-num {
    font-size: 20px;
    font-weight: 800;
    color: var(--acid);
  }
  .score-card-lbl {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div class="top-hud">
    <div class="hud-stat">
      <span class="hud-label">突围距离</span>
      <span id="distVal" class="hud-val">0 m</span>
    </div>
    <div class="buffer-meter">
      <span class="buffer-title">⏳ 子弹时间</span>
      <div class="buffer-bar"><div id="bufferFill" class="buffer-fill"></div></div>
    </div>
    <div class="hud-stat" style="text-align: right;">
      <span class="hud-label">得分 / 擦弹</span>
      <span id="scoreVal" class="hud-val" style="color: var(--acid);">0</span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="touch-deck">
    <div id="joyZone" class="joy-zone">
      <div id="joyKnob" class="joy-knob"></div>
    </div>
    <button id="btnBuffer" class="btn-buffer">
      <span>⏳ 缓冲</span>
      <span style="font-size:9px; opacity:0.85;">空格 / 长按</span>
    </button>
  </div>

  <!-- Start Overlay -->
  <div id="startOverlay" class="overlay">
    <h1 class="modal-title">⚡ 子弹缓冲</h1>
    <p class="modal-sub">
      赛博弹幕穿梭 · 掌握时间膨胀之力！<br>
      面对密集的激光与转轮陷阱，长按<b>【子弹缓冲】</b>将时间慢放 80%！<br>
      在针尖距离间优雅<b>【擦弹】</b>可迅速补充缓冲能量！<br>
      WASD/方向键/摇杆移动 · 空格/Shift开启子弹时间
    </p>
    <button id="startBtn" class="btn-start">开始突围</button>
  </div>

  <!-- Over Overlay -->
  <div id="overOverlay" class="overlay hidden">
    <h2 class="modal-title" id="overTitle">核心过载</h2>
    <p class="modal-sub" id="overSub">在致命的激光走廊中化为数据尘埃</p>
    <div class="score-grid">
      <div class="score-card">
        <div id="finalDist" class="score-card-num">0 m</div>
        <div class="score-card-lbl">突围距离</div>
      </div>
      <div class="score-card">
        <div id="finalScore" class="score-card-num">0</div>
        <div class="score-card-lbl">最终得分</div>
      </div>
      <div class="score-card">
        <div id="finalGraze" class="score-card-num">0</div>
        <div class="score-card-lbl">擦弹次数</div>
      </div>
      <div class="score-card">
        <div id="finalSlows" class="score-card-num">0</div>
        <div class="score-card-lbl">时间膨胀</div>
      </div>
    </div>
    <button id="retryBtn" class="btn-start">再入走廊</button>
  </div>
</div>

<script src="../_shared/storage.js"></script>
<script src="game.js"></script>
</body>
</html>
