<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>宠物物语 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .stat-val {
      font-weight: bold;
      color: #facc15;
    }
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      overflow-y: auto;
      justify-content: space-between;
    }
    .pets-pen {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .pet-card {
      background: #1e293b;
      border: 2px solid #475569;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s;
    }
    .pet-card.selected {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56,189,248,0.4);
    }
    .pet-card.ready-adopt {
      border-color: #22c55e;
      background: rgba(34,197,94,0.1);
    }
    .pet-avatar {
      font-size: 40px;
    }
    .pet-name {
      font-weight: bold;
      font-size: 15px;
      color: #f8fafc;
    }
    .stat-bar-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: #94a3b8;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bar-bg {
      flex: 1;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      transition: width 0.2s;
    }
    .actions-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 10px;
    }
    .act-btn {
      flex: 1;
      padding: 10px 4px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .act-btn:hover {
      border-color: #38bdf8;
      background: #475569;
    }
    .act-btn:active {
      transform: scale(0.95);
    }
    .adopt-btn {
      padding: 6px 14px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>🐾 宠物物语 (Pet Shop)</div>
    <div>领养成功: <span id="adopt-count" class="stat-val">0 只</span></div>
    <div>金币: <span id="coins-el" class="stat-val">🪙 0</span></div>
  </div>

  <div class="main-view">
    <div style="font-size:13px; color:#94a3b8; text-align:center;">
      点击选中萌宠，使用底部护理工具照顾宠物！满足全部需求即可送养！
    </div>

    <div class="pets-pen" id="pets-pen"></div>

    <div class="actions-bar">
      <button class="act-btn" id="act-feed">
        <span style="font-size:22px;">🍖</span>
        <span>喂食</span>
      </button>
      <button class="act-btn" id="act-wash">
        <span style="font-size:22px;">🛁</span>
        <span>洗澡</span>
      </button>
      <button class="act-btn" id="act-play">
        <span style="font-size:22px;">🎾</span>
        <span>逗玩</span>
      </button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
