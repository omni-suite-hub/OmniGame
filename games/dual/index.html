<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>双子镜像 - OmniGame</title>
<link rel="stylesheet" href="../_shared/game-layout.css">
<style>
  :root {
    --bg: #070814;
    --card: #11142a;
    --solar: #fbbf24;
    --solar-glow: rgba(251, 191, 36, 0.45);
    --lunar: #38bdf8;
    --lunar-glow: rgba(56, 189, 248, 0.45);
    --text: #f8fafc;
    --text-dim: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, #15193a 0%, #070814 85%);
  }
  /* Top HUD */
  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(7, 8, 20, 0.95) 0%, transparent 100%);
    pointer-events: none;
  }
  .hud-stat {
    display: flex;
    flex-direction: column;
  }
  .hud-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .hud-val {
    font-size: 17px;
    font-weight: 800;
    color: #fff;
  }
  .sync-badge {
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(90deg, rgba(251, 191, 36, 0.25), rgba(56, 189, 248, 0.25));
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .btn-reset-chamber {
    pointer-events: auto;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-reset-chamber:active {
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    transform: scale(0.95);
  }
  /* Canvas */
  #gameCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Bottom Control Deck */
  .control-deck {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 130px;
    z-index: 15;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px 16px;
  }
  .d-pad {
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }
  .ctrl-btn {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #fff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s ease;
  }
  .ctrl-btn:active {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(0.92);
  }
  .btn-jump {
    width: 76px;
    height: 60px;
    border-radius: 18px;
    background: linear-gradient(135deg, #fbbf24, #38bdf8);
    border: 0;
    color: #070814;
    font-weight: 900;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 4px 18px rgba(251, 191, 36, 0.4);
    touch-action: manipulation;
    transition: transform 0.08s ease;
  }
  .btn-jump:active {
    transform: scale(0.92);
  }
  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(7, 8, 20, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .modal-title {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
  }
  .modal-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
    line-height: 1.6;
    max-width: 320px;
  }
  .btn-action {
    padding: 12px 36px;
    border-radius: 999px;
    border: 0;
    background: linear-gradient(135deg, #fbbf24, #38bdf8);
    color: #070814;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(251, 191, 36, 0.4);
    transition: all 0.15s ease;
  }
  .btn-action:hover { transform: translateY(-2px); }
  .btn-action:active { transform: scale(0.97); }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 280px;
    margin-bottom: 24px;
  }
  .score-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px;
  }
  .score-card-num {
    font-size: 20px;
    font-weight: 800;
    color: var(--solar);
  }
  .score-card-lbl {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div class="top-hud">
    <div class="hud-stat">
      <span class="hud-label">镜像密室</span>
      <span id="chamberVal" class="hud-val">第 1 关</span>
    </div>
    <div class="sync-badge">🌓 日月双子同辉</div>
    <button id="btnResetChamber" class="btn-reset-chamber">🔄 重置 (Z)</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="control-deck">
    <div class="d-pad">
      <button id="btnLeft" class="ctrl-btn">◀</button>
      <button id="btnRight" class="ctrl-btn">▶</button>
    </div>
    <button id="btnJump" class="btn-jump">跳跃</button>
  </div>

  <!-- Start Overlay -->
  <div id="startOverlay" class="overlay">
    <h1 class="modal-title">🌓 双子镜像</h1>
    <p class="modal-sub">
      镜像同步解谜 · 同步操控日月双子！<br>
      左侧<b>【日之子】</b>与右侧<b>【月之女】</b>受你同一指令，但移动方向镜像相反！<br>
      跨界踩下机关解开彼岸结界，同时抵达日月祭坛！<br>
      方向键移动 · 空格/W跳跃 · Z重置
    </p>
    <button id="startBtn" class="btn-action">进入密室</button>
  </div>

  <!-- Clear Overlay -->
  <div id="clearOverlay" class="overlay hidden">
    <h2 class="modal-title" id="clearTitle">日月归一！</h2>
    <p class="modal-sub" id="clearSub">双子默契共鸣，突破了镜像结界</p>
    <div class="score-grid">
      <div class="score-card">
        <div id="finalChamber" class="score-card-num">1</div>
        <div class="score-card-lbl">完成关卡</div>
      </div>
      <div class="score-card">
        <div id="finalTime" class="score-card-num">15s</div>
        <div class="score-card-lbl">通关耗时</div>
      </div>
    </div>
    <button id="nextBtn" class="btn-action">下一密室</button>
  </div>
</div>

<script src="../_shared/storage.js"></script>
<script src="game.js"></script>
</body>
</html>
