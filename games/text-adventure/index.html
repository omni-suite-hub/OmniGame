<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>文字冒险 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .hud-val {
      font-weight: bold;
      color: #38bdf8;
    }
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .story-log {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.8;
      color: #e2e8f0;
      min-height: 250px;
    }
    .log-paragraph {
      margin-bottom: 12px;
    }
    .log-paragraph strong {
      color: #facc15;
    }
    .choices-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .choice-btn {
      padding: 12px 16px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .choice-btn:hover {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .choice-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>❤️ 体力: <span id="hp-el" class="hud-val" style="color:#ef4444;">100</span></div>
    <div>🧠 理智: <span id="san-el" class="hud-val" style="color:#a855f7;">100</span></div>
    <div>🪙 宝藏: <span id="gold-el" class="hud-val" style="color:#facc15;">0</span></div>
  </div>

  <div class="main-view">
    <div class="story-log" id="story-log"></div>
    <div class="choices-box" id="choices-box"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
