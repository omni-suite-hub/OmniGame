<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>占地为王 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 14px;
      z-index: 10;
    }
    .hud-val {
      font-weight: bold;
      color: #38bdf8;
    }
    .arena-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      overflow: hidden;
    }
    canvas {
      background: #1e293b;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      touch-action: none;
    }
    .touch-controls {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 140px;
      z-index: 20;
    }
    .dpad-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #38bdf8;
      color: #fff;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-up    { top: 0; left: 48px; }
    .dpad-down  { bottom: 0; left: 48px; }
    .dpad-left  { top: 48px; left: 0; }
    .dpad-right { top: 48px; right: 0; }
    @media (hover: none), (pointer: coarse) {
      .touch-controls { display: block; }
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.hidden { display: none; }
    .modal h2 { font-size: 28px; margin: 0 0 10px 0; color: #ef4444; }
    .btn-respawn {
      margin-top: 16px;
      padding: 10px 24px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>👑 占地为王 (Paper Arena)</div>
    <div>领地占比: <span id="pct-el" class="hud-val">5.2%</span></div>
    <div>击杀: <span id="kills-el" class="hud-val" style="color:#facc15;">0</span></div>
  </div>

  <div class="arena-container" id="container">
    <canvas id="game-canvas"></canvas>

    <div class="touch-controls">
      <button class="dpad-btn dpad-up" id="btn-up">▲</button>
      <button class="dpad-btn dpad-down" id="btn-down">▼</button>
      <button class="dpad-btn dpad-left" id="btn-left">◀</button>
      <button class="dpad-btn dpad-right" id="btn-right">▶</button>
    </div>

    <div class="modal hidden" id="death-modal">
      <h2>💀 领地尾迹被切断！</h2>
      <p id="death-stat">最高占地: 14.8% | 斩杀: 2</p>
      <button class="btn-respawn" id="btn-respawn">重返战场</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
