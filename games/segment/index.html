<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>切词狂潮 - OmniGame</title>
<link rel="stylesheet" href="../_shared/game-layout.css">
<style>
  :root {
    --bg: #080912;
    --card: #121424;
    --gold: #f59e0b;
    --gold-glow: rgba(245, 158, 11, 0.45);
    --ink-red: #ef4444;
    --cyan: #06b6d4;
    --text: #f8fafc;
    --text-dim: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, #161833 0%, #080912 85%);
  }
  /* Top HUD */
  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(8, 9, 18, 0.95) 0%, transparent 100%);
    pointer-events: none;
  }
  .hud-stat {
    display: flex;
    flex-direction: column;
  }
  .hud-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .hud-val {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 10px var(--gold-glow);
  }
  .lives-bar {
    font-size: 16px;
    letter-spacing: 2px;
  }
  /* Canvas */
  #gameCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }
  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(8, 9, 18, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .modal-title {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 0 20px var(--gold-glow);
  }
  .modal-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
    line-height: 1.6;
    max-width: 320px;
  }
  .btn-start {
    padding: 12px 36px;
    border-radius: 999px;
    border: 0;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
    transition: all 0.15s ease;
  }
  .btn-start:hover { transform: translateY(-2px); }
  .btn-start:active { transform: scale(0.97); }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 280px;
    margin-bottom: 24px;
  }
  .score-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px;
  }
  .score-card-num {
    font-size: 20px;
    font-weight: 800;
    color: var(--gold);
  }
  .score-card-lbl {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div class="top-hud">
    <div class="hud-stat">
      <span class="hud-label">斩词得分</span>
      <span id="scoreVal" class="hud-val">0</span>
    </div>
    <div class="hud-stat" style="align-items: center;">
      <span class="hud-label">剑客生命</span>
      <span id="livesVal" class="lives-bar">❤️❤️❤️</span>
    </div>
    <div class="hud-stat" style="text-align: right;">
      <span class="hud-label">成语暴击</span>
      <span id="comboVal" class="hud-val" style="color: var(--gold);">0 连斩</span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- Start Overlay -->
  <div id="startOverlay" class="overlay">
    <h1 class="modal-title">🗡️ 切词狂潮</h1>
    <p class="modal-sub">
      水墨成语狂斩 · 刀光如练斩落汉字！<br>
      滑动鼠标或划动屏幕挥出水墨刀光，一刀切碎腾空的字符纸卷！<br>
      连续斩切同组成语字卷可触发<b>【成语大暴击】</b>！切勿斩击黑色墨煞炸弹！<br>
      划动屏幕即可斩击
    </p>
    <button id="startBtn" class="btn-start">拔剑起舞</button>
  </div>

  <!-- Over Overlay -->
  <div id="overOverlay" class="overlay hidden">
    <h2 class="modal-title" id="overTitle">剑气收鞘</h2>
    <p class="modal-sub" id="overSub">成语水墨墨韵留香</p>
    <div class="score-grid">
      <div class="score-card">
        <div id="finalScore" class="score-card-num">0</div>
        <div class="score-card-lbl">总分</div>
      </div>
      <div class="score-card">
        <div id="finalIdioms" class="score-card-num">0</div>
        <div class="score-card-lbl">成语暴击</div>
      </div>
      <div class="score-card">
        <div id="finalChars" class="score-card-num">0</div>
        <div class="score-card-lbl">斩断字符</div>
      </div>
      <div class="score-card">
        <div id="finalMaxCombo" class="score-card-num">0</div>
        <div class="score-card-lbl">最高连击</div>
      </div>
    </div>
    <button id="retryBtn" class="btn-start">再斩一局</button>
  </div>
</div>

<script src="../_shared/storage.js"></script>
<script src="game.js"></script>
</body>
</html>
