<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>七巧板 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 14px;
      z-index: 10;
    }
    .hud-val {
      font-weight: bold;
      color: #facc15;
    }
    .canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      overflow: hidden;
    }
    canvas {
      background: #1e293b;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      touch-action: none;
    }
    .ctl-bar {
      padding: 8px 16px;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .btn-ctl {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #334155;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-ctl:hover {
      background: #0284c7;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>🧩 七巧板 (Tangram Puzzle)</div>
    <div>关卡: <span id="level-title" class="hud-val">⛵ 帆船</span></div>
    <div>已拼合: <span id="match-count" class="hud-val" style="color:#22c55e;">0 / 7</span></div>
  </div>

  <div class="canvas-container" id="container">
    <canvas id="game-canvas"></canvas>
  </div>

  <div class="ctl-bar">
    <button class="btn-ctl" id="btn-rotate">🔄 旋转 45°</button>
    <button class="btn-ctl" id="btn-reset">↩️ 复位板件</button>
    <button class="btn-ctl" id="btn-next" style="background:#059669;">下一关 ➔</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
