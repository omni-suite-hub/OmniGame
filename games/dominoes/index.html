<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>多米诺骨牌 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: #1e293b;
      border-bottom: 2px solid #334155;
      font-size: 13px;
      z-index: 10;
    }
    .hud-val {
      font-weight: bold;
      color: #facc15;
    }
    .hand-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #0f172a;
      border-top: 1px solid #334155;
      overflow-x: auto;
    }
    .btn-draw {
      padding: 8px 14px;
      background: #475569;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    .arena-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #064e3b;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 4px 25px rgba(0,0,0,0.6);
      border-radius: 8px;
      touch-action: none;
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.hidden { display: none; }
    .modal h2 { font-size: 28px; margin: 0 0 10px 0; color: #facc15; }
    .btn-action {
      margin-top: 16px;
      padding: 10px 24px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>🀄 玩家手牌: <span id="player-count-el" class="hud-val">7</span></div>
    <div>🤖 电脑手牌: <span id="bot-count-el" class="hud-val">7</span></div>
    <div>牌堆剩余: <span id="boneyard-el" class="hud-val">14</span></div>
    <div>回合: <span id="turn-el" class="hud-val" style="color:#22c55e;">玩家回合</span></div>
  </div>

  <div class="arena-container" id="container">
    <canvas id="game-canvas"></canvas>

    <div class="modal hidden" id="game-modal">
      <h2 id="modal-title">🏆 多米诺大捷！</h2>
      <p id="modal-desc" style="font-size:16px;">手牌全部出尽！</p>
      <button class="btn-action" id="btn-restart">再来一盘</button>
    </div>
  </div>

  <div class="hand-bar">
    <button class="btn-draw" id="btn-draw">摸牌 (<span id="draw-count">14</span>)</button>
    <div id="player-tiles" style="display:flex; gap:6px;"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
