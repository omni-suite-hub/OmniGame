<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>经典填字 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      padding: 8px;
      gap: 12px;
    }
    @media (max-width: 640px) {
      .main-content { flex-direction: column; }
    }
    .grid-container {
      flex: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      border-radius: 12px;
      padding: 10px;
    }
    .crossword-grid {
      display: grid;
      gap: 2px;
      background: #334155;
      padding: 4px;
      border-radius: 8px;
    }
    .cw-cell {
      width: 38px;
      height: 38px;
      background: #ffffff;
      color: #0f172a;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .cw-cell.black {
      background: #0f172a;
      cursor: default;
    }
    .cw-cell.selected {
      background: #fde047 !important;
    }
    .cw-cell.highlight {
      background: #e0f2fe;
    }
    .cw-cell.error {
      background: #fecaca;
      color: #dc2626;
    }
    .cell-num {
      position: absolute;
      top: 2px;
      left: 2px;
      font-size: 9px;
      color: #64748b;
      line-height: 1;
    }
    .clues-container {
      flex: 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }
    .clue-title {
      font-weight: bold;
      color: #38bdf8;
      font-size: 14px;
      margin-bottom: 4px;
      border-bottom: 1px solid #334155;
      padding-bottom: 4px;
    }
    .clue-item {
      font-size: 13px;
      color: #94a3b8;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1.4;
    }
    .clue-item.active {
      background: #0284c7;
      color: #ffffff;
      font-weight: 600;
    }
    .clue-item:hover:not(.active) {
      background: #334155;
    }
    .bottom-keyboard {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      background: #0f172a;
      align-items: center;
    }
    .kb-row {
      display: flex;
      gap: 4px;
    }
    .kb-key {
      min-width: 30px;
      height: 38px;
      padding: 0 6px;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kb-key:active {
      background: #38bdf8;
      color: #0f172a;
    }
    .btn-action {
      padding: 6px 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>📝 经典填字 (Crossword)</div>
    <div style="display:flex; gap:8px;">
      <button class="btn-action" id="btn-check">检查</button>
      <button class="btn-action" id="btn-hint" style="background:#059669;">提示</button>
      <button class="btn-action" id="btn-reset" style="background:#dc2626;">重置</button>
    </div>
  </div>

  <div class="main-content">
    <div class="grid-container">
      <div id="grid" class="crossword-grid"></div>
    </div>
    <div class="clues-container">
      <div>
        <div class="clue-title">👉 横向提示 (ACROSS)</div>
        <div id="across-clues"></div>
      </div>
      <div style="margin-top:10px;">
        <div class="clue-title">👇 纵向提示 (DOWN)</div>
        <div id="down-clues"></div>
      </div>
    </div>
  </div>

  <div class="bottom-keyboard" id="keyboard"></div>

  <script src="game.js"></script>
</body>
</html>
