<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>深空引力漂 - OmniGame</title>
<link rel="stylesheet" href="../_shared/game-layout.css">
<style>
  :root {
    --bg: #050610;
    --card: #0d1024;
    --cyan: #00f2fe;
    --cyan-glow: rgba(0, 242, 254, 0.45);
    --gold: #fbbf24;
    --orbit: #818cf8;
    --text: #f8fafc;
    --text-dim: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #101438 0%, #050610 85%);
  }
  /* Top HUD */
  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(5, 6, 16, 0.95) 0%, transparent 100%);
    pointer-events: none;
  }
  .hud-stat {
    display: flex;
    flex-direction: column;
  }
  .hud-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .hud-val {
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 10px var(--cyan-glow);
  }
  .speed-val {
    font-size: 18px;
    font-weight: 900;
    color: var(--gold);
    font-family: ui-monospace, monospace;
  }
  /* Canvas */
  #gameCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
  }
  /* Bottom Controls Deck */
  .touch-deck {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 120px;
    z-index: 15;
    pointer-events: none;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-bottom: 16px;
  }
  .btn-tether {
    width: 160px;
    height: 60px;
    border-radius: 999px;
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    border: 0;
    color: #050610;
    font-weight: 900;
    font-size: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 242, 254, 0.5);
    pointer-events: auto;
    touch-action: manipulation;
    transition: transform 0.08s ease;
  }
  .btn-tether:active, .btn-tether.active {
    transform: scale(0.94);
    box-shadow: 0 0 24px rgba(0, 242, 254, 0.8);
  }
  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(5, 6, 16, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .modal-title {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 0 20px var(--cyan-glow);
  }
  .modal-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
    line-height: 1.6;
    max-width: 320px;
  }
  .btn-start {
    padding: 12px 36px;
    border-radius: 999px;
    border: 0;
    background: linear-gradient(135deg, #00f2fe, #4facfe);
    color: #050610;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
    transition: all 0.15s ease;
  }
  .btn-start:hover { transform: translateY(-2px); }
  .btn-start:active { transform: scale(0.97); }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 280px;
    margin-bottom: 24px;
  }
  .score-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px;
  }
  .score-card-num {
    font-size: 20px;
    font-weight: 800;
    color: var(--cyan);
  }
  .score-card-lbl {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div class="top-hud">
    <div class="hud-stat">
      <span class="hud-label">跃迁星门</span>
      <span id="gatesVal" class="hud-val">0 门</span>
    </div>
    <div class="hud-stat" style="align-items: center;">
      <span class="hud-label">航速</span>
      <span id="speedVal" class="speed-val">450 km/s</span>
    </div>
    <div class="hud-stat" style="text-align: right;">
      <span class="hud-label">星尘得分</span>
      <span id="scoreVal" class="hud-val" style="color: var(--gold);">0 ⭐</span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="touch-deck">
    <button id="btnTether" class="btn-tether">
      <span>🧲 引力锁定</span>
      <span style="font-size:9px; opacity:0.85;">长按回旋 · 松开弹射</span>
    </button>
  </div>

  <!-- Start Overlay -->
  <div id="startOverlay" class="overlay">
    <h1 class="modal-title">🚀 深空引力漂</h1>
    <p class="modal-sub">
      轨道引力弹射 · 穿梭星际之门！<br>
      靠近行星时，长按<b>【引力锁定】</b>拉住引力缆绳高速轨道回旋蓄力！<br>
      找准航向松开缆绳，以极速<b>【引力弹射】</b>飞跃深空穿透星门！<br>
      长按屏幕/空格锁定 · 松开弹射
    </p>
    <button id="startBtn" class="btn-start">跃迁启航</button>
  </div>

  <!-- Over Overlay -->
  <div id="overOverlay" class="overlay hidden">
    <h2 class="modal-title" id="overTitle">飞船迷航</h2>
    <p class="modal-sub" id="overSub">在深空引力漂流中完成了壮丽航行</p>
    <div class="score-grid">
      <div class="score-card">
        <div id="finalScore" class="score-card-num">0 ⭐</div>
        <div class="score-card-lbl">星尘总分</div>
      </div>
      <div class="score-card">
        <div id="finalGates" class="score-card-num">0</div>
        <div class="score-card-lbl">贯穿星门</div>
      </div>
      <div class="score-card">
        <div id="finalMaxSpeed" class="score-card-num">0</div>
        <div class="score-card-lbl">极速 (km/s)</div>
      </div>
      <div class="score-card">
        <div id="finalSling" class="score-card-num">0</div>
        <div class="score-card-lbl">弹射次数</div>
      </div>
    </div>
    <button id="retryBtn" class="btn-start">再入星系</button>
  </div>
</div>

<script src="../_shared/storage.js"></script>
<script src="game.js"></script>
</body>
</html>
