<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>单词搜索 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .stat-val {
      font-weight: bold;
      color: #38bdf8;
    }
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      gap: 10px;
      overflow-y: auto;
    }
    .word-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 500px;
      width: 100%;
    }
    .target-word {
      padding: 4px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      color: #e2e8f0;
      transition: all 0.2s;
    }
    .target-word.found {
      background: #059669;
      color: #fff;
      text-decoration: line-through;
      border-color: #10b981;
    }
    .grid-board {
      display: grid;
      grid-template-columns: repeat(10, 32px);
      grid-template-rows: repeat(10, 32px);
      gap: 2px;
      background: #1e293b;
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      touch-action: none;
    }
    @media (min-width: 480px) {
      .grid-board {
        grid-template-columns: repeat(10, 38px);
        grid-template-rows: repeat(10, 38px);
        gap: 3px;
      }
    }
    .letter-cell {
      background: #334155;
      color: #f8fafc;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
    }
    .letter-cell.highlight {
      background: #0284c7 !important;
      color: #fff !important;
    }
    .letter-cell.found-cell {
      background: #059669;
      color: #fff;
    }
    .bottom-bar {
      padding: 8px;
      display: flex;
      gap: 12px;
    }
    .btn-action {
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>🔍 单词搜索 (Word Search)</div>
    <div>已找: <span id="found-count" class="stat-val">0 / 6</span></div>
    <div>⏱️ <span id="timer-val" class="stat-val">00:00</span></div>
  </div>

  <div class="main-view">
    <div class="word-list" id="word-list"></div>

    <div class="grid-board" id="grid"></div>

    <div class="bottom-bar">
      <button class="btn-action" id="btn-restart" style="background:#2563eb;">🔄 重新开局</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
