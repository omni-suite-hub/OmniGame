<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>疯狂拔河对决 - OmniGame</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <!-- Header -->
    <header class="game-header">
      <div class="header-top">
        <h1 class="game-title">
          <span class="title-emoji">🪢</span>
          <span class="title-text">疯狂拔河对决</span>
          <span class="title-badge">摸鱼联机</span>
        </h1>
        <div class="header-actions">
          <button id="soundBtn" class="icon-btn" title="声音开关">🔊</button>
          <button id="rulesBtn" class="icon-btn" title="玩法规则">❓</button>
          <button id="onlineBtn" class="btn btn-accent" title="发起/加入联机">🌐 联机对战</button>
        </div>
      </div>

      <!-- Settings Bar -->
      <div class="settings-bar">
        <div class="mode-pills" id="gameModePills">
          <button class="pill active" data-submode="classic">经典模式</button>
        </div>
        <div class="opponent-select">
          <button id="opponentTypeBtn" class="pill pill-outline">🤖 智能人机</button>
        </div>
      </div>

      <!-- Scoreboard -->
      <div class="scoreboard">
        <div class="score-card player-card" id="p1Card">
          <div class="avatar" id="p1Avatar">🐱</div>
          <div class="meta">
            <div class="name" id="p1Name">你</div>
            <div class="score"><span id="p1Score">0</span> 分</div>
          </div>
        </div>

        <div class="match-info">
          <div class="vs-text">VS</div>
          <div class="round-text" id="roundText">第 1 局</div>
        </div>

        <div class="score-card opp-card" id="p2Card">
          <div class="meta text-right">
            <div class="name" id="p2Name">摸鱼同事</div>
            <div class="score"><span id="p2Score">0</span> 分</div>
          </div>
          <div class="avatar" id="p2Avatar">🤖</div>
        </div>
      </div>
    </header>

    <!-- Arena Stage -->
    <main class="arena-stage" id="arenaStage">
      <!-- Opponent Zone -->
      <div class="character-row opp-char">
        <div class="character-avatar" id="oppAvatarMood">😏</div>
        <div class="speech-bubble" id="oppBubble">看我出奇制胜！</div>
      </div>

      <!-- Custom Play Area -->
      <div class="play-area" id="playArea">
        
    <div class="tug-wrapper">
      <div class="rope-track">
        <div class="win-marker left-marker">◀ 胜点</div>
        <div class="rope-visual" id="ropeVisual">
          <div class="tugger tugger-left" id="tuggerLeft">🐱💪</div>
          <div class="rope-line"></div>
          <div class="ribbon-marker">🎀</div>
          <div class="rope-line"></div>
          <div class="tugger tugger-right" id="tuggerRight">💪🤖</div>
        </div>
        <div class="win-marker right-marker">胜点 ▶</div>
      </div>
      <div class="stamina-meters">
        <div class="stamina-bar left-bar"><div class="stamina-fill" id="leftFill" style="width: 50%;"></div></div>
        <div class="stamina-bar right-bar"><div class="stamina-fill" id="rightFill" style="width: 50%;"></div></div>
      </div>
    </div>
  
      </div>

      <!-- Status Banner -->
      <div class="status-banner" id="statusBanner">开局准备中…</div>

      <!-- Player Zone -->
      <div class="character-row my-char">
        <div class="character-avatar" id="myAvatarMood">🐱</div>
        <div class="speech-bubble" id="myBubble">今天我必赢！</div>
      </div>
    </main>

    <!-- Controls Toolbar -->
    <footer class="game-controls" id="gameControls">
      <div class="controls-hint">狂按“给我拉”或敲击空格键 · 拉过标记线获胜</div>
      <div class="action-buttons" id="actionButtons">
        
    <button id="pullBtn" class="btn btn-accent btn-massive">💥 极速狂按！给我拉！</button>
  
      </div>
    </footer>
  </div>

  <!-- Penalty Modal -->
  <div class="modal-overlay hidden" id="penaltyModal">
    <div class="modal-card penalty-card">
      <div class="modal-emoji">🏆🎉🥤</div>
      <h2 class="modal-title" id="penaltyTitle">决斗胜负已分！</h2>
      <p class="modal-desc" id="penaltyDesc">胜败乃兵家常事，快接受今天的摸鱼惩罚：</p>
      
      <div class="penalty-box">
        <div class="penalty-tag">今日办公室惩罚</div>
        <div class="penalty-text" id="penaltyResultText">请赢家喝一杯大杯拿铁！☕</div>
      </div>

      <div class="modal-actions">
        <button id="reRollPenaltyBtn" class="btn btn-secondary">🎲 重新抽取</button>
        <button id="nextRoundBtn" class="btn btn-primary">再战一局 🔥</button>
      </div>
    </div>
  </div>

  <!-- Rules Modal -->
  <div class="modal-overlay hidden" id="rulesModal">
    <div class="modal-card">
      <h2 class="modal-title">📖 玩法说明</h2>
      <div class="rules-content" id="rulesContent">
        
    <p>1. 极速狂按“给我拉”按钮或敲击<strong>空格键 / 回车键</strong>！</p>
    <p>2. 手速越快拉力越大，将中间红丝带拉入己方半场标记点即获胜！</p>
    <p>3. 考验单身手速与办公室解压的巅峰时刻！</p>
  
      </div>
      <div class="modal-actions">
        <button id="closeRulesBtn" class="btn btn-primary">我知道了</button>
      </div>
    </div>
  </div>

  <script src="../_shared/omni-net.js"></script>
  <script src="game.js"></script>
</body>
</html>
