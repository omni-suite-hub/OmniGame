<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>农场物语 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .gold-stat {
      color: #facc15;
      font-weight: bold;
      font-size: 16px;
    }
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 10px;
      gap: 10px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .tools-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }
    .tool-btn {
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tool-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56,189,248,0.4);
    }
    .farm-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1;
    }
    .plot-tile {
      background: #78350f;
      border: 2px solid #92400e;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
      transition: all 0.15s;
    }
    .plot-tile.watered {
      background: #451a03;
      border-color: #38bdf8;
    }
    .plot-emoji {
      font-size: 34px;
    }
    .plot-timer {
      font-size: 11px;
      color: #fef08a;
      background: rgba(0,0,0,0.5);
      padding: 1px 6px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .seeds-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .seed-card {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 70px;
    }
    .seed-card.selected {
      border-color: #facc15;
      background: #334155;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>🌾 农场物语 (Farm Life)</div>
    <div>天气: <span id="weather-el">☀️ 晴</span></div>
    <div>金币: <span id="gold-el" class="gold-stat">🪙 50</span></div>
  </div>

  <div class="main-view">
    <div class="tools-bar">
      <button class="tool-btn active" id="tool-seed">🌱 播种</button>
      <button class="tool-btn" id="tool-water">💧 浇水</button>
      <button class="tool-btn" id="tool-harvest">🌾 收获</button>
    </div>

    <div class="farm-grid" id="farm-grid"></div>

    <div>
      <div style="font-size:13px; color:#94a3b8; margin-bottom:4px; text-align:center;">选择种子（点击播种到空土地）</div>
      <div class="seeds-bar" id="seeds-bar"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
