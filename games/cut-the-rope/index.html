<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>割绳子 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #7c2d12;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: #431407;
      border-bottom: 2px solid #7c2d12;
      font-size: 14px;
      z-index: 10;
    }
    .hud-val {
      font-weight: bold;
      color: #facc15;
    }
    .arena-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #9a3412;
      overflow: hidden;
    }
    canvas {
      background: #451a03;
      box-shadow: 0 4px 25px rgba(0,0,0,0.5);
      border-radius: 12px;
      touch-action: none;
      cursor: crosshair;
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(67, 20, 7, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.hidden { display: none; }
    .modal h2 { font-size: 30px; margin: 0 0 10px 0; color: #facc15; }
    .btn-action {
      margin-top: 18px;
      padding: 12px 28px;
      background: #ea580c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>⭐ 星星: <span id="stars-el" class="hud-val">0 / 3</span></div>
    <div>关卡: <span id="level-el" class="hud-val">1 / 3</span></div>
    <div>🪙 得分: <span id="score-el" class="hud-val">0</span></div>
  </div>

  <div class="arena-container" id="container">
    <canvas id="game-canvas"></canvas>

    <div class="modal hidden" id="game-modal">
      <h2 id="modal-title">🍬 饱餐一顿！</h2>
      <p id="modal-desc" style="font-size:16px;">小怪兽开心吞下了糖果！</p>
      <button class="btn-action" id="btn-restart">进入下一关</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
