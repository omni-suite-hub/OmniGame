<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>像素鸟 · OmniGame</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-wrap">
      <header class="game-header">
        <div class="score-card">
          <span class="label">当前得分</span>
          <span class="val" id="scoreVal">0</span>
        </div>
        <div class="score-card best">
          <span class="label">历史最高</span>
          <span class="val" id="bestVal">0</span>
        </div>
        <div class="header-tools">
          <button id="soundBtn" class="tool-btn" title="开关音效">🔊</button>
          <button id="restartBtn" class="tool-btn" title="重新开始">🔄</button>
        </div>
      </header>

      <main class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas" width="360" height="580"></canvas>
        <div id="startOverlay" class="start-hint">按 空格 或 点击屏幕 飞行 🐦</div>
      </main>

      <footer class="game-footer">
        <span class="tip-text">按 <code>空格</code> / <code>↑</code> 或点击屏幕拍翅膀；穿过水管得分</span>
      </footer>

      <!-- Game Over Modal -->
      <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-card">
          <div class="modal-medal" id="modalMedal">🥉</div>
          <h2 class="modal-title">GAME OVER</h2>
          <div class="modal-stats">
            <div class="stat-item">
              <span class="stat-label">本次得分</span>
              <span class="stat-num" id="finalScore">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">历史最佳</span>
              <span class="stat-num" id="finalBest">0</span>
            </div>
          </div>
          <button id="playAgainBtn" class="modal-btn">🔄 再来一局 (按空格重开)</button>
        </div>
      </div>
    </div>

    <script src="../_shared/storage.js"></script>
    <script src="game.js"></script>
  </body>
</html>
