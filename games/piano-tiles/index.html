<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>别踩白块儿 · OmniGame</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-wrap">
      <header class="game-header">
        <div class="score-card">
          <span class="label">得分</span>
          <span class="val" id="scoreVal">0</span>
        </div>
        <div class="song-title-badge" id="songTitle">🎵 《致爱丽丝》</div>
        <div class="score-card best">
          <span class="label">最高</span>
          <span class="val" id="bestVal">0</span>
        </div>
        <div class="header-tools">
          <button id="soundBtn" class="tool-btn" title="开关音效">🔊</button>
          <button id="restartBtn" class="tool-btn" title="重新开始">🔄</button>
        </div>
      </header>

      <main class="canvas-container" id="canvasContainer">
        <canvas id="gameCanvas" width="360" height="580"></canvas>
        <div id="startOverlay" class="start-hint">点击第一块黑块开始弹奏 🎹</div>
      </main>

      <footer class="game-footer">
        <div class="key-hints">
          <span class="key-cap">D</span>
          <span class="key-cap">F</span>
          <span class="key-cap">J</span>
          <span class="key-cap">K</span>
        </div>
        <p class="tip-text">键盘 <code>D F J K</code> 或直接点击黑块；千万别踩白块！</p>
      </footer>

      <!-- Game Over Modal -->
      <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-card">
          <div class="modal-emoji">🎹</div>
          <h2 class="modal-title" id="modalTitle">踩到白块了！</h2>
          <div class="modal-stats">
            <div class="stat-item">
              <span class="stat-label">弹奏得分</span>
              <span class="stat-num" id="finalScore">0</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">历史最高</span>
              <span class="stat-num" id="finalBest">0</span>
            </div>
          </div>
          <button id="playAgainBtn" class="modal-btn">🔄 再来一曲 🎵</button>
        </div>
      </div>
    </div>

    <script src="../_shared/storage.js"></script>
    <script src="game.js"></script>
  </body>
</html>
