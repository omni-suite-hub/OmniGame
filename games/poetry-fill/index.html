<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>诗词填空 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .badge {
      font-weight: bold;
      color: #facc15;
    }
    .poetry-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      gap: 18px;
    }
    .poem-meta {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }
    .poem-title {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 4px;
    }
    .poem-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .verse-line {
      font-size: 22px;
      line-height: 2;
      letter-spacing: 4px;
      color: #e2e8f0;
    }
    .blank-slot {
      display: inline-block;
      width: 38px;
      height: 38px;
      border-bottom: 3px solid #facc15;
      color: #facc15;
      font-weight: bold;
      vertical-align: middle;
      text-align: center;
      line-height: 38px;
      margin: 0 4px;
      background: rgba(250, 204, 21, 0.1);
      border-radius: 6px;
    }
    .choices-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
    }
    .char-btn {
      height: 54px;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .char-btn:hover {
      background: #475569;
      border-color: #38bdf8;
    }
    .char-btn:active {
      transform: scale(0.92);
      background: #38bdf8;
      color: #0f172a;
    }
    .note-box {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      text-align: center;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>🎋 诗词填空 (Poetry Fill)</div>
    <div>关卡: <span id="level-el" class="badge">1 / 10</span></div>
    <div>得分: <span id="score-el" class="badge">0</span></div>
  </div>

  <div class="poetry-container">
    <div class="poem-meta">
      <div class="poem-title" id="poem-title">静夜思</div>
      <div id="poem-author">〔唐〕李白</div>
    </div>

    <div class="poem-card">
      <div class="verse-line" id="verse-prev">床前明月光</div>
      <div class="verse-line" id="verse-target">
        疑是地上<span class="blank-slot" id="blank-slot">？</span>
      </div>
    </div>

    <div class="note-box" id="poem-note">
      点击下方候选汉字填补诗句缺字。
    </div>

    <div class="choices-grid" id="choices-grid"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
