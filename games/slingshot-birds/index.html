<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>弹弓破坏 - OmniGame</title>
  <link rel="stylesheet" href="../_shared/game-layout.css">
  <style>
    body {
      background: #0284c7;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 12px;
      background: #0369a1;
      border-bottom: 2px solid #0284c7;
      font-size: 14px;
      z-index: 10;
    }
    .hud-val {
      font-weight: bold;
      color: #facc15;
    }
    .arena-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #38bdf8 0%, #7dd3fc 70%, #15803d 70%, #166534 100%);
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 4px 25px rgba(0,0,0,0.4);
      border-radius: 8px;
      touch-action: none;
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal.hidden { display: none; }
    .modal h2 { font-size: 30px; margin: 0 0 10px 0; color: #facc15; }
    .btn-action {
      margin-top: 18px;
      padding: 12px 28px;
      background: #eab308;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>🐦 剩余小鸟: <span id="birds-el" class="hud-val">3</span></div>
    <div>🐷 目标敌军: <span id="pigs-el" class="hud-val">3</span></div>
    <div>关卡: <span id="level-el" class="hud-val">1 / 3</span></div>
    <div>🪙 得分: <span id="score-el" class="hud-val">0</span></div>
  </div>

  <div class="arena-container" id="container">
    <canvas id="game-canvas"></canvas>

    <div class="modal hidden" id="game-modal">
      <h2 id="modal-title">🏆 完美全歼！</h2>
      <p id="modal-desc" style="font-size:16px;">堡垒崩塌，小猪已全数被击飞！</p>
      <button class="btn-action" id="btn-restart">下一关卡</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
