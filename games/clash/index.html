<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>战舰装配对撞 - OmniGame</title>
<link rel="stylesheet" href="../_shared/game-layout.css">
<style>
  :root {
    --bg: #070914;
    --card: #10142b;
    --cyan: #00f2fe;
    --cyan-glow: rgba(0, 242, 254, 0.45);
    --pink: #ff007f;
    --pink-glow: rgba(255, 0, 127, 0.45);
    --gold: #f59e0b;
    --text: #f8fafc;
    --text-dim: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 25%, #151a3a 0%, #070914 85%);
  }
  /* Top HUD */
  .top-hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(7, 9, 20, 0.95) 0%, transparent 100%);
    pointer-events: none;
  }
  .hud-stat {
    display: flex;
    flex-direction: column;
    width: 40%;
  }
  .hud-stat.right {
    align-items: flex-end;
  }
  .hud-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .hp-bar-track {
    width: 100%;
    height: 7px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 3px;
  }
  .hp-fill-player {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #00f2fe, #38bdf8);
    transition: width 0.1s linear;
  }
  .hp-fill-enemy {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff007f, #ef4444);
    transition: width 0.1s linear;
  }
  .round-title {
    font-size: 13px;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
  }
  /* Canvas */
  #gameCanvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Bottom Controls Deck */
  .control-deck {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 15;
    background: rgba(16, 20, 43, 0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    padding: 10px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .deck-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
  }
  .module-slots {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .mod-btn {
    flex: 1;
    padding: 8px 4px;
    border-radius: 10px;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: all 0.1s ease;
  }
  .mod-btn.active {
    background: rgba(0, 242, 254, 0.2);
    border-color: var(--cyan);
    color: var(--cyan);
    box-shadow: 0 0 12px var(--cyan-glow);
  }
  .btn-engage {
    width: 100%;
    padding: 12px;
    border-radius: 999px;
    border: 0;
    background: linear-gradient(135deg, #00f2fe, #38bdf8);
    color: #070914;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0, 242, 254, 0.45);
    transition: transform 0.08s ease;
  }
  .btn-engage:active {
    transform: scale(0.97);
  }
  .btn-boost-ram {
    width: 100%;
    padding: 12px;
    border-radius: 999px;
    border: 0;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(245, 158, 11, 0.45);
    transition: transform 0.08s ease;
  }
  .btn-boost-ram:active {
    transform: scale(0.97);
  }
  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(7, 9, 20, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .modal-title {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 0 20px var(--cyan-glow);
  }
  .modal-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
    line-height: 1.6;
    max-width: 320px;
  }
  .btn-start {
    padding: 12px 36px;
    border-radius: 999px;
    border: 0;
    background: linear-gradient(135deg, #00f2fe, #38bdf8);
    color: #070914;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
    transition: all 0.15s ease;
  }
  .btn-start:hover { transform: translateY(-2px); }
  .btn-start:active { transform: scale(0.97); }
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 280px;
    margin-bottom: 24px;
  }
  .score-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px;
  }
  .score-card-num {
    font-size: 20px;
    font-weight: 800;
    color: var(--cyan);
  }
  .score-card-lbl {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <div class="top-hud">
    <div class="hud-stat">
      <span class="hud-label">我方战舰</span>
      <div class="hp-bar-track"><div id="playerHpFill" class="hp-fill-player"></div></div>
    </div>
    <div id="roundVal" class="round-title">第 1 轮</div>
    <div class="hud-stat right">
      <span class="hud-label">敌方旗舰</span>
      <div class="hp-bar-track"><div id="enemyHpFill" class="hp-fill-enemy"></div></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="control-deck">
    <div class="deck-title">
      <span>装配模块 (选择最多 3 种)</span>
      <span id="selectedCount">已选: 3/3</span>
    </div>
    <div class="module-slots">
      <button class="mod-btn active" data-mod="cannon">
        <span style="font-size:16px;">🔴</span>
        <span>离子重炮</span>
      </button>
      <button class="mod-btn active" data-mod="shield">
        <span style="font-size:16px;">🔵</span>
        <span>偏折力场</span>
      </button>
      <button class="mod-btn active" data-mod="spike">
        <span style="font-size:16px;">🟢</span>
        <span>撞角尖刺</span>
      </button>
      <button class="mod-btn" data-mod="booster">
        <span style="font-size:16px;">⚡</span>
        <span>涡轮推进</span>
      </button>
    </div>
    <button id="btnAction" class="btn-engage">🚀 战舰出港 · 开始对撞</button>
  </div>

  <!-- Start Overlay -->
  <div id="startOverlay" class="overlay">
    <h1 class="modal-title">🛸 战舰装配对撞</h1>
    <p class="modal-sub">
      战舰模块组装 · 极速角斗场死斗！<br>
      选配<b>【离子重炮】</b>射击弹幕、<b>【偏折力场】</b>抵御冲击、<br>
      <b>【撞角尖刺】</b>重磅对撞碾压、<b>【涡轮推进】</b>极速突击！<br>
      出击后在角斗场中狂暴对撞直至敌舰瓦解！
    </p>
    <button id="startBtn" class="btn-start">进入船坞</button>
  </div>

  <!-- Battle Result Overlay -->
  <div id="resultOverlay" class="overlay hidden">
    <h2 class="modal-title" id="resTitle">胜利！敌舰解体</h2>
    <p class="modal-sub" id="resSub">我方战舰在激烈的撞击决斗中夺冠</p>
    <div class="score-grid">
      <div class="score-card">
        <div id="finalScore" class="score-card-num">0</div>
        <div class="score-card-lbl">战斗积分</div>
      </div>
      <div class="score-card">
        <div id="finalRound" class="score-card-num">1</div>
        <div class="score-card-lbl">获胜轮次</div>
      </div>
    </div>
    <button id="nextRoundBtn" class="btn-start">下一轮死斗</button>
  </div>
</div>

<script src="../_shared/storage.js"></script>
<script src="game.js"></script>
</body>
</html>
